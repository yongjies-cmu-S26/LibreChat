endpoints:
  agents:
    recursionLimit: 50
    maxRecursionLimit: 100
    titleTiming: immediate
    maxCitations: 30
    maxCitationsPerFile: 7
    minRelevanceScore: 0.45
    # Every built-in capability (code execution needs LIBRECHAT_CODE_API_KEY; OCR needs a Mistral key)
    capabilities:
      - 'deferred_tools'
      - 'execute_code'
      - 'file_search'
      - 'web_search'
      - 'artifacts'
      - 'subagents'
      - 'actions'
      - 'context'
      - 'skills'
      - 'memory'
      - 'ask_user_question'
      - 'tools'
      - 'ocr'
      - 'programmatic_tools'
      - 'run_in_background'

  # Second OpenAI key (the "free" one from your old NextChat site).
  # The built-in OpenAI endpoint uses OPENAI_API_KEY (the paid key).
  custom:
    - name: 'OpenAI Free'
      apiKey: '${OPENAI_FREE_API_KEY}'
      baseURL: 'https://api.openai.com/v1'
      models:
        default: ['gpt-5.4', 'gpt-5.2', 'gpt-5.1', 'gpt-5', 'o3', 'gpt-4.1', 'gpt-4o', 'gpt-5.4-mini', 'gpt-5-mini', 'o4-mini', 'gpt-4.1-mini', 'gpt-4o-mini', 'gpt-5.4-nano']
        fetch: false
      titleConvo: true
      titleModel: 'gpt-5.4-mini'
      modelDisplayLabel: 'OpenAI (Free Key)'
